<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiwi">
<title>Kiwi · 猕猴桃-你的文件助手</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <img class="brandLogo" src="logo.svg" alt="Kiwi 标志">
      <div class="brandText">
        <div class="appname">Kiwi</div>
        <div class="tagline">猕猴桃-你的文件助手</div>
      </div>
    </div>
    <div id="connStatus" class="status">正在准备…</div>

    <div class="selfRow">
      <div class="selfLine"><span class="selfLabel">本机：</span><span id="selfBadge"></span></div>
      <div class="selfEdit">
        <input id="devName" placeholder="给本机起个名字">
        <button id="btnSaveName" class="ghost small">保存名字</button>
      </div>
    </div>

    <button id="btnAddDevice" class="primary addBtn">＋ 添加新设备</button>

    <section id="devicePanel" class="sideSection">
      <div class="panelTitle">已连接的设备 <span id="devCount"></span></div>
      <ul id="deviceList"></ul>
    </section>

    <section id="trustedCard" class="sideSection hidden">
      <div class="panelTitle">已信任的设备</div>
      <ul id="trustedList"></ul>
      <p class="hint">点「重连」即可连回对方，不用再扫码。前提是对方的 Kiwi 页面正打开着；对方没打开时会显示连不上。</p>
    </section>

    <section id="joinSection" class="sideSection">
      <div class="panelTitle">加入其他设备</div>
      <button id="btnScan" class="ghost scanBtn">📷 扫码加入</button>
      <div class="manualRow">
        <input id="manualCode" placeholder="连接码">
        <button id="btnManual" class="ghost">加入</button>
      </div>
    </section>

    <div class="sideFoot">
      <button id="btnRoom" class="ghost small">回到顶部</button>
    </div>
  </aside>

  <div id="mainArea">
    <section id="reconnectBar" class="slimBar hidden">
      <p class="hint" id="reconnectText">正在尝试重连已信任的设备…</p>
      <button id="btnSkipReconnect" class="ghost small">跳过，直接打开我的二维码</button>
    </section>

    <section id="joinBanner" class="slimBar hidden">
      <div id="joinBannerText">已连接到对方设备。</div>
      <label class="switchRow">
        <input type="checkbox" id="chkTrustHost">
        <span><b>信任此设备</b>——记住这个连接，以后打开本页就能一键重连（或自动尝试重连），不用再扫码。仍需对方页面同时打开。</span>
      </label>
      <div class="row">
        <button id="btnForgetHost" class="ghost small danger hidden">取消信任 / 忘记此设备</button>
      </div>
    </section>


    <div id="stage">
      <section id="hostHero" class="hidden">
        <div id="heroQrBox"></div>
        <div class="heroRoom">连接码 <b id="heroRoomCode"></b> <span id="heroSessionType" class="tag"></span></div>
        <div class="joinUrlRow">
          <span id="heroJoinUrl" class="joinUrl"></span>
          <button id="btnCopyJoinUrl" class="ghost small">复制链接</button>
        </div>
        <label class="switchRow">
          <input type="checkbox" id="chkRememberChannel">
          <span><b>记住此设备</b></span>
        </label>
        <div class="row">
          <button id="btnRegen" class="ghost danger">结束会话并换新二维码</button>
        </div>
        <p class="hint">须在线使用</p>
      </section>

      <main id="messages"></main>
    </div>

    <section id="transfers"></section>

    <footer id="inputBar">
      <div class="row">
        <label for="targetSel">发送给：</label>
        <select id="targetSel"><option value="ALL">所有设备</option></select>
        <label class="fileBtn">📎 文件<input type="file" id="fileInput" multiple hidden></label>
      </div>
      <div class="row growRow">
        <textarea id="textInput" rows="2" placeholder="可将文件拖拽至此发送，Shift+Enter 换行"></textarea>
        <button id="btnSend" class="primary">发送</button>
      </div>
    </footer>

    <div id="scanModal" class="modal hidden">
      <div class="card">
        <h3>扫描二维码</h3>
        <video id="scanVideo" playsinline muted></video>
        <canvas id="scanCanvas" hidden></canvas>
        <p id="scanTip" class="hint">正在打开摄像头…</p>
        <button id="btnCloseScan" class="ghost">取消</button>
      </div>
    </div>
  </div>
</div>

<div id="qrModal" class="modal hidden">
  <div class="card">
    <h3>扫码加入</h3>
    <div id="qrBox"></div>
    <p class="hint">连接码：<b id="qrRoomCode"></b><br>用另一台设备的相机扫码，会直接打开本页并自动加入；也可以在另一台设备打开 Kiwi 后点「扫码加入」。</p>
    <button id="btnCloseQR" class="primary">关闭</button>
  </div>
</div>

<script src="libs/qrcode.min.js"></script>
<script src="libs/peerjs.min.js"></script>
<script src="libs/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
